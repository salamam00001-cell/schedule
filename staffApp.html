<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول العمل — عرض الموظفين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --primary-light: #2563a8;
    --accent: #0ea5e9;
    --surface: #f8fafc;
    --surface2: #eef2f7;
    --border: #cbd5e1;
    --text: #1e293b;
    --text-muted: #64748b;
    --morning: #0284c7;
    --evening: #7c3aed;
    --night: #1e3a5f;
    --off-weekly: #16a34a;
    --off-annual: #0891b2;
    --off-sick: #dc2626;
    --off-official: #d97706;
    --off-absent: #374151;
    --radius: 10px;
    --zoom: 1;
  }

  /* ── Dark mode ── */
  body.dark-mode {
    --primary: #0f172a;
    --primary-light: #1e40af;
    --accent: #38bdf8;
    --surface: #1e293b;
    --surface2: #0f172a;
    --border: #334155;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
  }

  body.dark-mode .schedule-card {
    background: #1e293b;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  body.dark-mode .schedule-table td {
    border-bottom-color: #334155;
  }

  body.dark-mode .schedule-table tr:nth-child(even) td {
    background: #1a2744;
  }

  body.dark-mode .schedule-table tr:hover td {
    background: #1e3a5f;
  }

  body.dark-mode .schedule-table td.name-cell {
    background: #1e293b !important;
    color: #7dd3fc;
  }

  body.dark-mode .day-cell.empty {
    background: #0f172a;
    border-color: #334155;
  }

  body.dark-mode .day-cell.morning    { background: #1e3a5f; }
  body.dark-mode .day-cell.evening    { background: #2e1065; }
  body.dark-mode .day-cell.weekly-off { background: #14532d; }
  body.dark-mode .day-cell.annual-leave   { background: #164e63; }
  body.dark-mode .day-cell.sick-leave     { background: #7f1d1d; }
  body.dark-mode .day-cell.official-holiday { background: #78350f; }
  body.dark-mode .day-cell.absent     { background: #1e293b; }

  body.dark-mode .status-bar {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.7);
  }

  .dark-toggle-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .dark-toggle-btn:hover { background: rgba(255,255,255,0.22); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #0f2942 0%, #1a3a5c 50%, #0f2942 100%);
    min-height: 100vh;
    color: var(--text);
    direction: rtl;
  }

  header {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
  }

  .logo svg { width: 32px; height: 32px; flex-shrink: 0; }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .connection-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .connected    { background: #dcfce7; color: #16a34a; }
  .disconnected { background: #fee2e2; color: #dc2626; }
  .connecting   { background: #fef3c7; color: #d97706; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  /* ── Zoom controls ── */
  .zoom-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .zoom-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.15s;
    font-family: 'Cairo', sans-serif;
  }
  .zoom-btn:hover { background: rgba(255,255,255,0.22); }

  .zoom-label {
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    font-weight: 600;
    min-width: 34px;
    text-align: center;
  }

  main { padding: 1.5rem 2rem; max-width: 1600px; margin: 0 auto; }

  /* ── Status bar ── */
  .status-bar {
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 7px 14px;
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1rem;
  }

  .spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
    flex-shrink: 0;
  }
  .spinner.active { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Week navigation ── */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
  }

  .week-label {
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    min-width: 240px;
    text-align: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-outline {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .btn-outline:hover { background: rgba(255,255,255,0.18); }

  /* ── Schedule card ── */
  .schedule-card {
    background: rgba(255,255,255,0.97);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* zoom wrapper */
  .zoom-wrap {
    transform-origin: top right;
    transform: scale(var(--zoom));
    /* width compensation so card doesn't collapse */
    width: calc(100% / var(--zoom));
  }

  .schedule-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
  }

  .schedule-table th {
    background: var(--primary);
    color: #fff;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
  }

  .schedule-table th.name-col {
    text-align: right;
    padding-right: 20px;
    min-width: 160px;
  }

  .day-header { min-width: 100px; }

  .day-date {
    display: block;
    font-size: 11px;
    opacity: 0.75;
    font-weight: 400;
    margin-top: 2px;
  }

  .schedule-table tr:nth-child(even) td { background: var(--surface); }
  .schedule-table tr:hover td { background: #e0f0ff; }

  .schedule-table td {
    padding: 5px;
    border-bottom: 1px solid #e2e8f0;
    text-align: center;
    transition: background 0.15s;
  }

  .schedule-table td.name-cell {
    text-align: right;
    padding: 10px 18px 10px 8px;
    font-weight: 600;
    color: var(--primary);
    font-size: 14px;
    background: #fff !important;
    border-left: 3px solid var(--accent);
  }

  .day-cell {
    min-height: 42px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 2px;
    border: 2px solid transparent;
    padding: 5px;
    gap: 2px;
  }

  .day-cell.empty      { background: #f8fafc; border: 2px dashed #e2e8f0; }
  .day-cell.morning    { background: #dbeafe; border-color: var(--morning);   color: var(--morning); }
  .day-cell.evening    { background: #ede9fe; border-color: var(--evening);   color: var(--evening); }
  .day-cell.night      { background: #1e3a5f; border-color: #3b82f6;          color: #93c5fd; }
  .day-cell.weekly-off { background: #dcfce7; border-color: var(--off-weekly);color: var(--off-weekly); }
  .day-cell.annual-leave   { background: #cffafe; border-color: var(--off-annual);  color: var(--off-annual); }
  .day-cell.sick-leave     { background: #fee2e2; border-color: var(--off-sick);    color: var(--off-sick); }
  .day-cell.official-holiday { background: #fef3c7; border-color: var(--off-official); color: var(--off-official); }
  .day-cell.absent     { background: #f1f5f9; border-color: var(--off-absent); color: var(--off-absent); }

  .cell-icon  { font-size: 17px; }
  .cell-label { font-size: 10px; font-weight: 700; }
  .cell-name  { font-size: 9px; font-weight: 600; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 88px; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1e293b;
    color: #fff;
    padding: 11px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Cairo', sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    transition: transform 0.3s;
    z-index: 2000;
  }
  .toast.show    { transform: translateX(-50%) translateY(0); }
  .toast.success { background: #16a34a; }
  .toast.error   { background: #dc2626; }
  .toast.info    { background: #0284c7; }

  /* ── Sync pulse dot ── */
  .sync-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #22c55e;
    display: inline-block;
    flex-shrink: 0;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.7); }
  }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    main   { padding: 0.8rem 0.8rem; }
    header { padding: 0 0.8rem; height: 54px; }
    .logo span { display: none; }
    .logo svg  { width: 28px; height: 28px; }
    .week-label { font-size: 13px; min-width: 140px; }
    .week-nav   { gap: 0.4rem; }
    .week-nav .btn { padding: 7px 10px; font-size: 12px; }
    .connection-badge { font-size: 11px; padding: 4px 8px; }
    .zoom-btn   { width: 28px; height: 28px; font-size: 16px; }
    .zoom-label { font-size: 11px; }
    .schedule-table th   { font-size: 12px; padding: 10px 5px; }
    .schedule-table th.name-col { min-width: 120px; }
    .day-header { min-width: 82px; }
    .schedule-table td.name-cell { font-size: 12px; padding: 7px 12px 7px 6px; }
    .cell-icon  { font-size: 13px; }
    .cell-label { font-size: 8px; }
    .cell-name  { font-size: 7px; max-width: 68px; }
    .day-cell   { padding: 3px; margin: 1px; min-height: 36px; }
  }

  @media (max-width: 480px) {
    .schedule-table { min-width: 680px; }
    .day-header { min-width: 74px; }
    .schedule-table th.name-col { min-width: 100px; }
    .schedule-table th   { font-size: 11px; padding: 8px 4px; }
    .schedule-table td.name-cell { font-size: 11px; padding: 6px 8px 6px 4px; }
    .cell-icon  { font-size: 11px; }
    .cell-label { font-size: 7px; }
    .cell-name  { font-size: 6px; max-width: 58px; }
    .day-cell   { padding: 2px; margin: 1px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="36" height="36" rx="10" fill="rgba(255,255,255,0.15)"/>
      <rect x="6" y="9"  width="24" height="2.5" rx="1.25" fill="#fff"/>
      <rect x="6" y="15" width="18" height="2.5" rx="1.25" fill="#7dd3fc"/>
      <rect x="6" y="21" width="20" height="2.5" rx="1.25" fill="#a5b4fc"/>
      <rect x="6" y="27" width="14" height="2.5" rx="1.25" fill="#93c5fd"/>
    </svg>
    <span>جدول العمل الأسبوعي</span>
  </div>

  <div class="header-left">
    <!-- Zoom controls -->
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="changeZoom(-0.1)" title="تصغير">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="zoom-btn" onclick="changeZoom(+0.1)" title="تكبير">+</button>
    </div>
    <!-- Dark mode toggle -->
    <button class="dark-toggle-btn" id="darkToggleBtn" onclick="toggleDarkMode()" title="الوضع الليلي">🌙</button>
    <!-- Connection badge -->
    <span id="connectionBadge" class="connection-badge disconnected">
      <span class="dot"></span> غير متصل
    </span>
  </div>
</header>

<main>
  <!-- Status -->
  <div class="status-bar">
    <div class="spinner" id="spinner"></div>
    <span class="sync-dot" id="syncDot" style="display:none"></span>
    <span id="statusText">جاري تحميل البيانات…</span>
  </div>

  <!-- Week Navigation -->
  <div class="week-nav">
    <button class="btn btn-outline" onclick="changeWeek(-1)">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      الأسبوع السابق
    </button>
    <div class="week-label" id="weekLabel">—</div>
    <button class="btn btn-outline" onclick="changeWeek(1)">
      الأسبوع القادم
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>

  <!-- Schedule Table -->
  <div class="schedule-card">
    <div class="table-scroll">
      <div class="zoom-wrap" id="zoomWrap">
        <table class="schedule-table" id="scheduleTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // ── Constants (same as main app) ───────────────────────
  const DAYS_AR = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
  const SHIFT_LABELS = {
    morning:            { label:'صباحية', icon:'☀️',  cls:'morning'          },
    evening:            { label:'مسائية', icon:'🌆',  cls:'evening'          },
    night:              { label:'ليلية',  icon:'🌙',  cls:'night'            },
    'weekly-off':       { label:'راحة',   icon:'🛋️', cls:'weekly-off'       },
    'annual-leave':     { label:'سنوية',  icon:'🌴',  cls:'annual-leave'     },
    'sick-leave':       { label:'مرضية',  icon:'🏥',  cls:'sick-leave'       },
    'official-holiday': { label:'رسمية',  icon:'🎌',  cls:'official-holiday' },
    absent:             { label:'غياب',   icon:'❌',  cls:'absent'           },
    empty:              { label:'',       icon:'',    cls:'empty'            },
  };

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGKrZ8RsUeUTrM7SnQFznzsthmKlHLfNjbVzKyH_fiw2oBSrh9Ce24ADf8f1mC5VdzTQ/exec';

  let employees = [];
  let schedule  = {};
  let currentWeekOffset = 0;
  let zoomLevel = 1;

  // ── Utilities ──────────────────────────────────────────
  function getWeekDates(offset) {
    const today = new Date();
    const diff  = (today.getDay() + 1) % 7;
    const sat   = new Date(today);
    sat.setDate(today.getDate() - diff + offset * 7);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(sat);
      d.setDate(sat.getDate() + i);
      days.push(d);
    }
    return days;
  }

  function fmtDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function fmtDisplay(d) { return `${d.getDate()}/${d.getMonth()+1}`; }
  function schedKey(empId, dateStr) { return `${empId}_${dateStr}`; }

  // ── Zoom ───────────────────────────────────────────────
  function changeZoom(delta) {
    zoomLevel = Math.min(2, Math.max(0.4, +(zoomLevel + delta).toFixed(1)));
    applyZoom();
  }

  function applyZoom() {
    const wrap = document.getElementById('zoomWrap');
    wrap.style.setProperty('--zoom', zoomLevel);
    wrap.style.transform = `scale(${zoomLevel})`;
    wrap.style.width     = `${(100 / zoomLevel).toFixed(2)}%`;
    document.getElementById('zoomLabel').textContent = Math.round(zoomLevel * 100) + '%';
  }

  // ── Render ─────────────────────────────────────────────
  function render() {
    const days  = getWeekDates(currentWeekOffset);
    const start = days[0], end = days[6];

    document.getElementById('weekLabel').textContent =
      `الأسبوع: ${fmtDisplay(start)} — ${fmtDisplay(end)} / ${end.getFullYear()}`;

    const head = document.getElementById('tableHead');
    head.innerHTML = `<tr>
      <th class="name-col">الموظف</th>
      ${days.map((d,i) => `<th class="day-header">${DAYS_AR[i]}<span class="day-date">${fmtDisplay(d)}</span></th>`).join('')}
    </tr>`;

    const body = document.getElementById('tableBody');
    if (!employees.length) {
      body.innerHTML = `<tr><td colspan="${days.length+1}" style="padding:40px;text-align:center;color:#94a3b8;font-size:15px;">
        لا توجد بيانات — في انتظار المزامنة…
      </td></tr>`;
      return;
    }

    body.innerHTML = employees.map(emp => {
      const cells = days.map(d => {
        const ds   = fmtDate(d);
        const sh   = schedule[schedKey(emp.id, ds)] || 'empty';
        const info = SHIFT_LABELS[sh] || SHIFT_LABELS.empty;
        return `<td>
          <div class="day-cell ${info.cls}">
            <span class="cell-icon">${info.icon}</span>
            ${info.label ? `<span class="cell-label">${info.label}</span>` : ''}
            <span class="cell-name">${emp.name}</span>
          </div>
        </td>`;
      }).join('');

      return `<tr>
        <td class="name-cell">${emp.name}
          ${emp.dept ? `<br><span style="font-size:11px;color:#94a3b8;font-weight:400">${emp.dept}</span>` : ''}
        </td>
        ${cells}
      </tr>`;
    }).join('');
  }

  function changeWeek(d) {
    currentWeekOffset += d;
    render();
  }

  // ── API ────────────────────────────────────────────────
  async function loadFromSheets() {
    setStatus('جاري تحميل البيانات…', true);
    try {
      const res  = await fetch(`${SCRIPT_URL}?action=load`, { method: 'GET', redirect: 'follow' });
      const data = JSON.parse(await res.text());
      if (data && data.success) {
        employees = data.employees || [];
        schedule  = data.schedule  || {};
        setConnected(true);
        setStatus(`متصل ✓ — تم تحميل ${employees.length} موظف`, false, true);
        render();
      } else {
        throw new Error(data?.error || 'خطأ غير معروف');
      }
    } catch(err) {
      setConnected(false);
      setStatus('⚠️ تعذّر الاتصال — سيُعاد المحاولة خلال 5 ثوانٍ');
    }
  }

  async function syncFromSheets() {
    try {
      const res  = await fetch(`${SCRIPT_URL}?action=load`, { method: 'GET', redirect: 'follow' });
      const data = JSON.parse(await res.text());
      if (data && data.success) {
        employees = data.employees || [];
        schedule  = data.schedule  || {};
        setConnected(true);
        setStatus(`متصل ✓ — آخر مزامنة: ${new Date().toLocaleTimeString('ar-EG')}`, false, true);
        render();
      } else {
        setConnected(false);
      }
    } catch {
      setConnected(false);
    }
  }

  // ── UI helpers ─────────────────────────────────────────
  function setStatus(msg, loading = false, synced = false) {
    document.getElementById('statusText').textContent = msg;
    document.getElementById('spinner').classList.toggle('active', loading);
    document.getElementById('syncDot').style.display = synced ? 'inline-block' : 'none';
  }

  function setConnected(val) {
    const b = document.getElementById('connectionBadge');
    b.className = `connection-badge ${val ? 'connected' : 'disconnected'}`;
    b.innerHTML = `<span class="dot"></span> ${val ? 'متصل بـ Google Sheets' : 'غير متصل'}`;
  }

  let toastTimer;
  function showToast(msg, type = 'info') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Dark mode ──────────────────────────────────────────
  function toggleDarkMode() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('darkToggleBtn').textContent = isDark ? '☀️' : '🌙';
    localStorage.setItem('darkMode', isDark ? '1' : '0');
  }

  // Restore preference on load
  if (localStorage.getItem('darkMode') === '1') {
    document.body.classList.add('dark-mode');
    document.getElementById('darkToggleBtn').textContent = '☀️';
  }

  // ── Init ───────────────────────────────────────────────
  render();
  loadFromSheets();
  setInterval(syncFromSheets, 5000);
</script>
</body>
</html>
