<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#262626">
<title>Notes</title>
<link rel="icon" type="image/png" href="Nots.png">
<link rel="apple-touch-icon" href="Nots.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#222;color:#fff;font-family:Roboto,'Noto Naskh Arabic','Droid Arabic Naskh',sans-serif;font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:26px;height:26px;fill:currentColor}
[hidden]{display:none!important}
#top{position:sticky;top:0;z-index:5;background:#262626;border-bottom:1px solid #111;padding-top:env(safe-area-inset-top,0px)}
.tb{height:66px;display:flex;align-items:center;padding:0 8px 0 16px;gap:6px}
.tb h1{flex:1;margin:0;font-weight:300;font-size:36px;color:#a8a8a8;letter-spacing:-.5px}
.tb button{width:44px;height:44px;display:grid;place-items:center;color:#ddd}
#sb{padding:8px 12px}
#q{width:100%;background:#333;border:0;border-bottom:2px solid #7ecdc0;color:#fff;font:inherit;padding:10px 12px;outline:none}
#sortb,#ab{display:block;width:calc(100% - 24px);margin:10px 12px 0;height:40px;background:#363636;font-weight:500}
#ab{color:#7ecdc0}
#list{padding:10px 12px 150px}
.row{display:flex;align-items:stretch;background:#000;margin-bottom:10px;min-height:62px;cursor:pointer;border:1px solid #1a1a1a}
.row i{width:11px;flex:none}
.row b{flex:1;font-weight:500;font-size:21px;line-height:1.35;padding:10px 12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;align-self:center}
.row span{align-self:center;color:#a0a0a0;font-weight:500;padding:0 14px 0 8px;font-size:17px;white-space:nowrap;min-width:84px;text-align:left}
.rs{align-self:center;margin:0 12px 0 6px;border:1px solid #7ecdc0;color:#7ecdc0;border-radius:4px;padding:8px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.empty{text-align:center;color:#888;padding:70px 20px}
#fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:16px;background:#8fd0c6;color:#16302c;font-size:40px;font-weight:300;line-height:1;z-index:6;box-shadow:0 3px 8px #0008}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#262626;border-top:1px solid #111;display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;height:58px;display:grid;place-items:center;color:#b4b4b4}
nav button.on{color:#7ecdc0}
#cal{padding:6px 12px 150px}
.ch{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.ch b{font-size:20px;font-weight:500}
.ch button{font-size:30px;width:48px;height:40px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.g u{text-decoration:none;color:#888;font-size:13px;padding:4px 0}
.d{height:52px;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:2px solid transparent}
.d.t{color:#7ecdc0;font-weight:700}
.d.s{border-color:#7ecdc0}
.d em{display:flex;gap:3px;height:6px}
.d em s{width:6px;height:6px;border-radius:50%}
#cl{margin-top:14px}
/* editor */
#ed{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;--hc:#857a2a}
.eh{background:var(--hc);padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;min-height:calc(66px + env(safe-area-inset-top,0px));padding-inline:4px 4px}
.eh b{flex:1;font-weight:500;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
.eh button{width:46px;height:46px;display:grid;place-items:center}
.meta{display:flex;justify-content:space-between;color:#9a9a9a;font-weight:500;font-size:17px;padding:8px 14px}
#ec{flex:1;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ln{display:block;width:100%;min-height:100%;border:0;outline:none;background:repeating-linear-gradient(to bottom,transparent 0 41px,color-mix(in srgb,var(--hc) 55%,#000) 41px 42px) local;color:#fff;font:inherit;font-size:24px;line-height:42px;padding:0 14px;resize:none;unicode-bidi:plaintext;text-align:start}
#vw a{color:#a9b8ff}
textarea.ln{height:100%}
.lt{width:100%;background:none;border:0;border-bottom:1px solid #333;outline:none;color:#fff;font:inherit;font-size:24px;font-weight:500;padding:8px 14px}
.ci{display:flex;align-items:center;gap:10px;padding:2px 14px;border-bottom:1px solid #222}
.ci input[type=checkbox]{width:22px;height:22px;accent-color:#7ecdc0;flex:none}
.ci input[type=text]{flex:1;background:none;border:0;outline:none;color:#fff;font:inherit;font-size:21px;padding:11px 0}
.ci.d input[type=text]{text-decoration:line-through;color:#777}
.ci button{color:#888;width:36px;height:36px}
#add{color:#7ecdc0;padding:14px}
#dlg{position:fixed;inset:0;background:#0009;z-index:40;display:grid;place-items:center;padding:20px}
#dlg>div{background:#2b2b2b;width:100%;max-width:340px;max-height:80vh;overflow:auto;border-radius:4px}
#dlg>div>button,#dlg label{display:block;width:100%;text-align:start;padding:15px 20px;border-bottom:1px solid #3a3a3a}
#dlg input{width:100%;background:#1a1a1a;border:0;border-bottom:2px solid #7ecdc0;color:#fff;font:inherit;padding:8px;margin-top:8px}
.cs{display:flex;flex-wrap:wrap;gap:14px;padding:18px;justify-content:center}
.cc{width:46px;height:46px;border-radius:50%}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#444;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;z-index:50}
</style>
</head>
<body>
<div id="top">
  <div class="tb">
    <h1 id="ttl">Notes</h1>
    <button id="cfb" aria-label="Colors"><svg viewBox="0 0 24 24" style="width:30px;height:30px"><rect x="2" y="2" width="9.5" height="9.5" fill="#4fb3d9"/><rect x="12.5" y="2" width="9.5" height="9.5" fill="#d8e04a"/><rect x="2" y="12.5" width="9.5" height="9.5" fill="#9a8fc0"/><rect x="12.5" y="12.5" width="9.5" height="9.5" fill="#e8643c"/></svg></button>
    <button id="dots" aria-label="Sort"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>
  <div id="sb" hidden><input id="q" type="search" dir="auto" placeholder="Search"></div>
</div>
<button id="sortb"></button>
<button id="ab" hidden></button>
<div id="list"></div>
<div id="cal" hidden></div>
<button id="fab" aria-label="New note">+</button>
<nav>
  <button data-v="list" aria-label="Notes"><svg viewBox="0 0 24 24"><path d="M6 4h12a1 1 0 011 1v15a1 1 0 01-1 1H6a1 1 0 01-1-1V5a1 1 0 011-1zm2 5v2h8V9H8zm0 4v2h8v-2H8z"/></svg></button>
  <button data-v="cal" aria-label="Calendar"><svg viewBox="0 0 24 24"><path d="M7 2v2H5a1 1 0 00-1 1v15a1 1 0 001 1h14a1 1 0 001-1V5a1 1 0 00-1-1h-2V2h-2v2H9V2z"/><text x="12" y="18" font-size="9" text-anchor="middle" fill="#262626" font-weight="700" font-family="Roboto,sans-serif">31</text></svg></button>
  <button data-v="pin" aria-label="Pinned"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
  <button data-v="search" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg></button>
  <button data-v="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 5h18v2.4H3zm0 5.8h18v2.4H3zM3 16.6h18V19H3z"/></svg></button>
</nav>

<div id="ed" hidden>
  <div class="eh">
    <button id="eb" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <b id="et" dir="auto"></b>
    <button id="ep" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M3 17.3V21h3.7L17.8 9.9l-3.7-3.7L3 17.3zM20.7 7a1 1 0 000-1.4l-2.3-2.3a1 1 0 00-1.4 0l-1.8 1.8 3.7 3.7L20.7 7z"/></svg></button>
    <button id="em" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
  </div>
  <div class="meta"><span id="ago"></span><span id="dt"></span></div>
  <div id="ec"></div>
</div>
<div id="dlg" hidden></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
/* ===== إعدادات Firebase (اختياري): الصق هنا إعدادات مشروعك =====
   {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."} */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC7UfGib3FlDqWO46-bA_zC0GjfXQBXgg0",
  authDomain: "mynots-cee85.firebaseapp.com",
  projectId: "mynots-cee85",
  storageBucket: "mynots-cee85.firebasestorage.app",
  messagingSenderId: "992646998936",
  appId: "1:992646998936:web:c51eeab8dc22154bbd19ed"
};

const C=[['#e0e0e0','#6f6f6f'],['#c9a227','#857a2a'],['#e8922e','#a8661a'],['#d9534f','#8f2f2c'],['#b06fc4','#6e4380'],['#4a90d9','#2d5f94'],['#2fb5a3','#1d7468'],['#6bbf59','#3e7a32']];
const SORTS={updated:'Sort by modified time',created:'Sort by created time',title:'Sort by title',color:'Sort by color'};
const KEY='notes_v2';
let notes=[],view='list',sort='updated',cf=-1,cur=null,mode='view',cm=new Date(),sel=null,tm;
try{notes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(tm);tm=setTimeout(()=>e.hidden=true,2500)};
const title=n=>n.type==='list'?(n.title||(n.items[0]||{}).t||''):(n.body.split('\n').find(l=>l.trim())||'');
const linkify=l=>esc(l).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const same=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
function fmt(t){const d=new Date(t);if(same(t,Date.now()))return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString('en-US',d.getFullYear()===new Date().getFullYear()?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'})}
function ago(t){const m=Math.floor((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min. ago':m<1440?Math.floor(m/60)+' hr. ago':Math.floor(m/1440)+' days ago'}
function persist(n){n.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}syncPush(n)}

/* ===== القائمة ===== */
function visible(){
  let l=notes.filter(n=>{
    if(cf>=0&&n.c!==cf)return false;
    if(view==='trash')return n.deleted&&!n.purged;
    if(n.deleted)return false;
    if(view==='archive')return !!n.archived;
    if(n.archived)return false;
    return view!=='pin'||n.pinned;
  });
  const q=$('q').value.trim().toLowerCase();
  if(q)l=l.filter(n=>(n.body+' '+(n.title||'')+' '+n.items.map(i=>i.t).join(' ')).toLowerCase().includes(q));
  const k={updated:(a,b)=>b.updated-a.updated,created:(a,b)=>b.created-a.created,title:(a,b)=>title(a).localeCompare(title(b),'ar'),color:(a,b)=>a.c-b.c}[sort];
  return l.sort((a,b)=>(!!b.pinned-!!a.pinned)||k(a,b));
}
const row=n=>`<div class="row" data-id="${n.id}"><i style="background:${C[n.c][0]}"></i><b dir="auto">${n.pinned?'★ ':''}${esc(title(n)||'Untitled')}</b>${view==='archive'||view==='trash'?`<button class="rs" data-r="${n.id}">Restore</button>`:`<span>${fmt(n.updated)}</span>`}</div>`;
function render(){
  const c=view==='cal',x=view==='archive'||view==='trash';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(b.dataset.v==='search'&&!$('sb').hidden)||(b.dataset.v==='menu'&&x)));
  $('ttl').textContent={archive:'Archive',trash:'Trash'}[view]||'Notes';
  $('cal').hidden=!c;$('list').hidden=c;$('sortb').hidden=c||x;$('ab').hidden=!x;
  $('ab').textContent=view==='trash'?'Empty trash':'Restore all';
  if(c)return renderCal();
  $('sortb').textContent=SORTS[sort]+' ▼';
  const l=visible();
  const em={archive:'Archive is empty. Archived notes appear here.',trash:'Trash is empty.'}[view]||'No notes here. Tap + to add one.';
  $('list').innerHTML=l.length?l.map(row).join(''):'<div class="empty">'+em+'</div>';
}
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function renderCal(){
  const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),map={},today=dk(Date.now());
  if(!sel)sel=today;
  notes.filter(x=>!x.deleted&&!x.archived).forEach(x=>[x.updated,x.remind&&new Date(x.remind).getTime()].filter(Boolean).forEach(t=>{(map[dk(t)]=map[dk(t)]||new Set()).add(x)}));
  let h=`<div class="ch"><button data-m="-1">‹</button><b>${cm.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button data-m="1">›</button></div><div class="g">`+'SMTWTFS'.split('').map(x=>`<u>${x}</u>`).join('');
  for(let i=0;i<f;i++)h+='<div></div>';
  for(let d=1;d<=n;d++){const k=y+'-'+m+'-'+d,s=[...(map[k]||[])].slice(0,3);
    h+=`<div class="d ${k===today?'t':''} ${k===sel?'s':''}" data-k="${k}">${d}<em>${s.map(x=>`<s style="background:${C[x.c][0]}"></s>`).join('')}</em></div>`}
  const l=[...(map[sel]||[])];
  $('cal').innerHTML=h+'</div><div id="cl">'+(l.length?l.map(row).join(''):'<div class="empty">No notes on this day</div>')+'</div>';
}
$('cal').onclick=e=>{
  const b=e.target.closest('[data-m]'),d=e.target.closest('[data-k]'),r=e.target.closest('.row');
  if(b){cm=new Date(cm.getFullYear(),cm.getMonth()+ +b.dataset.m,1);renderCal()}
  else if(d){sel=d.dataset.k;renderCal()}
  else if(r)openEd(notes.find(x=>x.id===r.dataset.id));
};
$('list').onclick=e=>{
  const b=e.target.closest('[data-r]');
  if(b){
    const n=notes.find(x=>x.id===b.dataset.r);
    if(view==='archive')n.archived=false;else{n.deleted=false;n.deletedAt=null}
    persist(n);render();toast('Restored');return;
  }
  const r=e.target.closest('.row');if(r)openEd(notes.find(x=>x.id===r.dataset.id))};
document.querySelector('nav').onclick=e=>{
  const v=(e.target.closest('button')||{dataset:{}}).dataset.v;
  if(v==='menu')return acts.menu();
  if(v==='search'){$('sb').hidden=!$('sb').hidden;if($('sb').hidden)$('q').value='';else $('q').focus();if(view==='cal')view='list';return render()}
  if(v){view=v;render()}
};
$('q').oninput=render;
$('sortb').onclick=$('dots').onclick=()=>dlg(Object.keys(SORTS).map(k=>mi('sort',SORTS[k],k)).join(''));
$('cfb').onclick=()=>dlg(mi('fc','All colors',-1)+'<div class="cs">'+C.map((c,i)=>`<button class="cc" data-a="fc" data-v="${i}" style="background:${c[0]}"></button>`).join('')+'</div>');
$('fab').onclick=()=>openEd({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:'text',title:'',body:'',items:[],c:cf>=0?cf:1,pinned:false,remind:'',created:Date.now(),updated:Date.now(),deleted:false,_new:true});

/* ===== الحوارات ===== */
const mi=(a,t,v='')=>`<button data-a="${a}" data-v="${v}">${t}</button>`;
function dlg(h){$('dlg').innerHTML='<div>'+h+'</div>';$('dlg').hidden=false}
$('dlg').onclick=e=>{
  const b=e.target.closest('[data-a]');
  if(b){$('dlg').hidden=true;acts[b.dataset.a](b.dataset.v)}
  else if(e.target===$('dlg'))$('dlg').hidden=true;
};
const acts={
  sort:v=>{sort=v;render()},
  fc:v=>{cf=+v;render()},
  setc:v=>{cur.c=+v;paintEd()},
  menu:()=>dlg(mi('vArch','Archive ('+notes.filter(n=>n.archived&&!n.deleted).length+')')+mi('vTrash','Trash ('+notes.filter(n=>n.deleted&&!n.purged).length+')')+(db?mi('signout','Sign out'):mi('sync','Sign in & sync'))+mi('exp','Export backup')+mi('imp','Import backup')+mi('about','About')),
  noop:()=>{},
  about:()=>dlg('<div style="position:relative;padding:44px 24px 30px;text-align:center;line-height:1.9"><button data-a="noop" aria-label="Close" style="position:absolute;top:4px;right:6px;width:42px;height:42px;font-size:24px;color:#ccc">✕</button><div style="font-size:20px;font-weight:500">Created by Moh.Salama</div><a href="mailto:salama.m@gmail.com" style="color:#7ecdc0;text-decoration:none">salama.m@gmail.com</a></div>'),
  vArch:()=>{view='archive';render()},
  vTrash:()=>{view='trash';render()},
  archive:()=>save({archived:true},'Moved to archive'),
  unarch:()=>save({archived:false},'Restored from archive'),
  restore:()=>save({deleted:false,deletedAt:null},'Restored'),
  purge:()=>{if(!confirm('Delete this note forever?'))return;save({deleted:true,purged:true,body:'',items:[],title:''},'Deleted forever')},
  exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(notes)],{type:'application/json'}));a.download='notes-backup.json';a.click()},
  imp:()=>$('file').click(),
  sync:()=>initSync(),
  doLogin:()=>doLogin(),
  signout:()=>signOut(),
  pin:()=>{cur.pinned=!cur.pinned;toast(cur.pinned?'Pinned':'Unpinned')},
  color:()=>dlg('<div class="cs">'+C.map((c,i)=>`<button class="cc" data-a="setc" data-v="${i}" style="background:${c[0]}"></button>`).join('')+'</div>'),
  type:()=>{
    if(cur.type==='text'){cur.items=cur.body.split('\n').filter(l=>l.trim()).map(t=>({t,d:false}));if(!cur.items.length)cur.items=[{t:'',d:false}];cur.type='list'}
    else{cur.body=cur.items.map(i=>i.t).join('\n');cur.type='text'}
    paintEd();
  },
  rem:()=>dlg(`<label>Reminder<input type="datetime-local" id="rmi" value="${cur.remind||''}"></label>`+mi('rsave','Save')+mi('rclr','Clear reminder')),
  rsave:()=>{cur.remind=$('rmi').value;if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();toast(cur.remind?'Reminder set':'')},
  rclr:()=>{cur.remind=''},
  del:()=>{if(cur._new)return closeEd(true);save({deleted:true,deletedAt:Date.now()},'Moved to trash')}
};

/* ===== المحرر ===== */
function openEd(n){cur=JSON.parse(JSON.stringify(n));mode=n._new?'edit':'view';$('ed').hidden=false;paintEd()}
function paintEd(){
  $('ed').style.setProperty('--hc',C[cur.c][1]);
  $('et').textContent=title(cur);
  $('ep').hidden=!!cur.deleted;$('ep').style.background=mode==='edit'?'#ffffff3a':'none';$('ep').style.borderRadius='50%';
  $('ago').textContent=cur._new?'now':ago(cur.updated);
  $('dt').textContent=new Date(cur.updated).toLocaleString('en-US',{year:'2-digit',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}).replace(',','');
  const ec=$('ec');
  if(cur.type==='list'){
    const ro=mode!=='edit'?'readonly':'',ed=mode==='edit';
    ec.innerHTML=(!ed&&!cur.title?'':`<input id="lt" class="lt" dir="auto" placeholder="Title" ${ro} value="${esc(cur.title||'')}">`)+cur.items.map((it,i)=>`<div class="ci ${it.d?'d':''}"><input type="checkbox" data-i="${i}" ${it.d?'checked':''} ${cur.deleted?'disabled':''}><input type="text" dir="auto" data-t="${i}" ${ro} value="${esc(it.t)}">${ed?`<button data-x="${i}">✕</button>`:''}</div>`).join('')+(ed?'<button id="add">+ Add item</button>':'');
  }else if(mode==='edit'){
    ec.innerHTML='<textarea id="bd" class="ln" dir="auto"></textarea>';$('bd').value=cur.body;$('bd').focus();
  }else ec.innerHTML='<div class="ln" id="vw">'+cur.body.split('\n').map(l=>`<div dir="auto">${linkify(l)||'&nbsp;'}</div>`).join('')+'</div>';
}
$('ec').oninput=e=>{
  const t=e.target;
  if(t.id==='bd'){cur.body=t.value;$('et').textContent=title(cur)}
  else if(t.id==='lt'){cur.title=t.value;$('et').textContent=title(cur)}
  else if(t.dataset.t!==undefined)cur.items[t.dataset.t].t=t.value;
};
$('ec').onclick=e=>{
  const t=e.target;
  if(t.dataset.i!==undefined){cur.items[t.dataset.i].d=t.checked;paintEd()}
  else if(t.dataset.x!==undefined){cur.items.splice(t.dataset.x,1);paintEd()}
  else if(t.id==='add'){cur.items.push({t:'',d:false});paintEd();const a=$('ec').querySelectorAll('input[type=text]');a[a.length-1].focus()}
};
$('ep').onclick=()=>{mode=mode==='edit'?'view':'edit';paintEd()};
$('em').onclick=()=>dlg(cur.deleted?mi('restore','Restore')+mi('purge','Delete forever'):mi('pin',cur.pinned?'Unpin':'Pin to top')+mi('color','Color')+mi('type',cur.type==='list'?'Convert to text note':'Convert to checklist')+mi('rem','Reminder')+(cur.archived?mi('unarch','Restore from archive'):mi('archive','Archive'))+mi('del','Move to trash'));
function save(p,msg){
  cur.items=cur.items.filter(i=>i.t.trim());
  Object.assign(cur,p);delete cur._new;
  const i=notes.findIndex(x=>x.id===cur.id);
  if(i<0)notes.push(cur);else notes[i]=cur;
  persist(cur);closeEd(true);toast(msg);
}
$('ab').onclick=()=>{
  if(view==='trash'){
    const l=notes.filter(n=>n.deleted&&!n.purged);if(!l.length)return;
    if(!confirm('Permanently delete '+l.length+' note(s)?'))return;
    l.forEach(n=>{Object.assign(n,{purged:true,body:'',items:[],title:''});persist(n)});toast('Trash emptied');
  }else{
    const l=notes.filter(n=>n.archived&&!n.deleted);if(!l.length)return;
    l.forEach(n=>{n.archived=false;persist(n)});toast('All notes restored');
  }
  render();
};
function closeEd(skip){
  if(!skip&&!cur.deleted){
    cur.items=cur.items.filter(i=>i.t.trim());
    const empty=!cur.body.trim()&&!cur.items.length&&!(cur.title||'').trim();
    if(!empty){
      const isNew=cur._new;delete cur._new;
      if(isNew)notes.push(cur);else notes[notes.findIndex(x=>x.id===cur.id)]=cur;
      persist(cur);
    }
  }
  $('ed').hidden=true;render();
}
$('eb').onclick=()=>closeEd();

/* ===== التذكيرات (والصفحة مفتوحة؛ في أندرويد استخدم Capacitor Local Notifications) ===== */
setInterval(()=>{
  notes.forEach(n=>{
    if(!n.deleted&&n.remind&&new Date(n.remind).getTime()<=Date.now()){
      const m=title(n)||'Reminder';
      if('Notification' in window&&Notification.permission==='granted')new Notification(m);
      toast('⏰ '+m);n.remind='';persist(n);render();
    }
  });
},20000);

/* ===== استيراد ===== */
$('file').onchange=async e=>{
  try{
    JSON.parse(await e.target.files[0].text()).forEach(n=>{const l=notes.find(x=>x.id===n.id);if(!l)notes.push(n);else if(l.updated<n.updated)Object.assign(l,n)});
    notes.forEach(persist);render();toast('Imported');
  }catch(err){toast('Invalid file')}
};

/* ===== مزامنة Firebase: users/{uid}/notes/{id} — الأحدث يكسب، والحذف بعلامة deleted ===== */
let db=null,uid=null,auth=null,unsub=null;
const load=s=>new Promise((ok,no)=>{const x=document.createElement('script');x.src=s;x.onload=ok;x.onerror=no;document.head.appendChild(x)});
/* تسجيل الدخول بالإيميل والباسورد (حسابات تنشئها أنت من Firebase Console > Authentication > Users)
   الجلسة بتتحفظ تلقائياً في المتصفح/الـ WebView، فمش هتحتاج تدخل البيانات كل مرة. */
async function initSync(){
  if(!FIREBASE_CONFIG)return toast('Add FIREBASE_CONFIG in the script first');
  if(db)return toast('Sync already on');
  try{
    if(!window.firebase){
      const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
      await load(b+'app-compat.js');await load(b+'auth-compat.js');await load(b+'firestore-compat.js');
    }
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    auth=firebase.auth();
    const u=await new Promise(r=>{const o=auth.onAuthStateChanged(x=>{o();r(x)})});
    if(u)startSync(u);else loginDlg();
  }catch(err){toast('Sync failed: '+(err.code||err.message))}
}
function loginDlg(msg){
  let em='';try{em=localStorage.getItem('notes_email')||''}catch(e){}
  dlg('<label>Email<input type="email" id="lem" dir="ltr" autocomplete="username" value="'+esc(em)+'"></label>'
    +'<label>Password<input type="password" id="lpw" dir="ltr" autocomplete="current-password"></label>'
    +(msg?'<div style="padding:4px 20px 10px;color:#e8643c;font-size:14px">'+esc(msg)+'</div>':'')
    +mi('doLogin','Sign in'));
}
async function doLogin(){
  const em=$('lem').value.trim(),pw=$('lpw').value;
  if(!em||!pw)return loginDlg('Enter email and password');
  try{
    const c=await auth.signInWithEmailAndPassword(em,pw);
    try{localStorage.setItem('notes_email',em)}catch(e){}
    startSync(c.user);
  }catch(err){
    const bad=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(err.code);
    loginDlg(bad?'Wrong email or password':'Sign in failed: '+(err.code||err.message));
  }
}
function startSync(user){
  uid=user.uid;db=firebase.firestore();
  try{localStorage.setItem('notes_sync','1')}catch(e){}
  let first=true;
  unsub=db.collection('users').doc(uid).collection('notes').onSnapshot(s=>{
    const r={};
    s.forEach(d=>{const n=d.data();r[n.id]=n;const l=notes.find(x=>x.id===n.id);if(!l)notes.push(n);else if(l.updated<n.updated)Object.assign(l,n)});
    if(first){first=false;notes.forEach(l=>{if(!r[l.id]||r[l.id].updated<l.updated)syncPush(l)})}
    try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}
    if($('ed').hidden)render();
  },err=>toast('Sync error: '+(err.code||err.message)));
  toast('Signed in, syncing');
}
async function signOut(){
  try{if(unsub)unsub();unsub=null;if(auth)await auth.signOut()}catch(e){}
  db=null;uid=null;
  try{localStorage.removeItem('notes_sync')}catch(e){}
  toast('Signed out');
}
function syncPush(n){
  if(!db)return;
  const {_new,...c}=n;
  db.collection('users').doc(uid).collection('notes').doc(n.id).set(c).catch(()=>toast('Upload failed'));
}
render();
/* لو المزامنة كانت شغالة قبل كده، ابدأها تلقائياً عند فتح الصفحة */
try{if(localStorage.getItem('notes_sync')==='1')initSync()}catch(e){}
</script>
