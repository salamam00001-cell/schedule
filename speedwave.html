<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موجة — قياس سرعة الإنترنت والواي فاي</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fb;--surface:rgba(255,255,255,.7);--line:rgba(20,30,70,.1);--text:#101735;--mute:#5d678a;--a:#0891d6;--b:#7c3aed;--c:#e11d74;--track:rgba(20,30,70,.09);--glow:.25;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a1c;--surface:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--text:#eef2ff;--mute:#8e9bc4;--a:#22e3ff;--b:#8b5cf6;--c:#ff4d9d;--track:rgba(255,255,255,.08);--glow:.6}}
:root[data-theme="dark"]{--bg:#060a1c;--surface:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--text:#eef2ff;--mute:#8e9bc4;--a:#22e3ff;--b:#8b5cf6;--c:#ff4d9d;--track:rgba(255,255,255,.08);--glow:.6}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Rubik',system-ui,'Segoe UI',Tahoma,sans-serif;overflow-x:hidden;position:relative}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;filter:blur(70px);opacity:var(--glow)}
.aurora i{position:absolute;border-radius:50%;width:55vmax;height:55vmax;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--b);top:-25vmax;right:-15vmax}
.aurora i:nth-child(2){background:var(--a);bottom:-30vmax;left:-20vmax;animation-delay:-8s}
.aurora i:nth-child(3){background:var(--c);width:30vmax;height:30vmax;top:35%;left:35%;opacity:.5;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 36px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px}
.brand svg{width:30px;height:30px}
.status{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.live .dot{background:var(--a);box-shadow:0 0 10px var(--a);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.stage{position:relative;margin:4px auto 0;width:100%;max-width:400px}
.stage svg.g{width:100%;display:block;overflow:visible}
.ripples{position:absolute;left:50%;top:57.5%;width:0;height:0}
.ripples b{position:absolute;width:150px;height:150px;margin:-75px;border-radius:50%;border:1.5px solid var(--a);opacity:0}
.live .ripples b{animation:ping 2.4s ease-out infinite}
.ripples b:nth-child(2){animation-delay:.8s!important}.ripples b:nth-child(3){animation-delay:1.6s!important}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.readout{position:absolute;left:0;right:0;top:41%;text-align:center}
.readout .v{font-size:clamp(56px,17vw,78px);font-weight:300;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums;direction:ltr}
.readout .u{font-size:15px;color:var(--mute);margin-top:4px}
.readout .ph{font-size:14px;color:var(--a);margin-top:8px;min-height:20px;font-weight:500}
.go{display:block;margin:6px auto 22px;border:0;cursor:pointer;font:500 17px 'Rubik',sans-serif;color:#fff;padding:15px 44px;border-radius:999px;background:linear-gradient(120deg,var(--b),var(--c));box-shadow:0 10px 30px -8px var(--c);transition:transform .15s,box-shadow .15s}
.go:hover{transform:translateY(-2px)}.go:active{transform:scale(.97)}
.go:disabled{opacity:.6;cursor:default;transform:none}
.go:focus-visible,.theme:focus-visible{outline:3px solid var(--a);outline-offset:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.card h3{font-size:13px;font-weight:400;color:var(--mute);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.card h3 svg{width:16px;height:16px}
.card .n{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.card .n small{font-size:13px;color:var(--mute);font-weight:400;margin-inline-start:4px}
.bar{height:5px;border-radius:9px;background:var(--track);margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.wide{grid-column:1/-1}
.wifi{display:flex;align-items:center;gap:18px}
.wifi svg{width:96px;height:96px;flex:none;overflow:visible}
.wifi .arc{fill:none;stroke:var(--track);stroke-width:9;stroke-linecap:round;transition:stroke .5s}
.wifi .arc.on{stroke:var(--a);filter:drop-shadow(0 0 6px var(--a))}
.live .wifi .arc.on{animation:wv 1.6s ease-in-out infinite}
.wifi .arc:nth-of-type(2){animation-delay:.2s!important}.wifi .arc:nth-of-type(3){animation-delay:.4s!important}
@keyframes wv{50%{opacity:.45}}
.wifi .info{flex:1}
.wifi .q{font-size:22px;font-weight:500}
.wifi .d{font-size:13px;color:var(--mute);margin-top:3px}
.bars{display:flex;gap:5px;align-items:flex-end;height:26px;margin-top:10px;direction:ltr}
.bars i{width:100%;border-radius:4px;background:var(--track);transition:background .4s}
.bars i.on{background:linear-gradient(0deg,var(--a),var(--b))}
.chart{width:100%;height:84px;display:block}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:16px;line-height:1.7}
.theme{background:var(--surface);border:1px solid var(--line);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px}
.credit{display:flex;justify-content:center;gap:6px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.credit b{font-weight:500;background:linear-gradient(120deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<main id="app">
<header>
<div class="brand">
<svg viewBox="0 0 32 32" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22e3ff"/><stop offset="1" stop-color="#ff4d9d"/></linearGradient></defs><path d="M3 20c3-8 6-8 9 0s6 8 9 0 5-8 8-4"/></svg>
موجة
</div>
<div style="display:flex;gap:12px;align-items:center">
<div class="status" id="status"><span class="dot"></span><span id="stxt">جاهز</span></div>
<button class="theme" id="theme" aria-label="تبديل المظهر">◐</button>
</div>
</header>

<div class="stage">
<svg class="g" viewBox="0 0 300 260" aria-hidden="true">
<defs>
<linearGradient id="ag" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="var(--a)"/><stop offset=".55" stop-color="var(--b)"/><stop offset="1" stop-color="var(--c)"/></linearGradient>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<path d="M72.2 227.8A110 110 0 1 1 227.8 227.8" pathLength="100" fill="none" stroke="var(--track)" stroke-width="14" stroke-linecap="round"/>
<path id="glow" d="M72.2 227.8A110 110 0 1 1 227.8 227.8" pathLength="100" fill="none" stroke="url(#ag)" stroke-width="14" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100" filter="url(#gl)" opacity=".7"/>
<path id="arc" d="M72.2 227.8A110 110 0 1 1 227.8 227.8" pathLength="100" fill="none" stroke="url(#ag)" stroke-width="14" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100"/>
<g id="ticks" font-size="10" fill="var(--mute)" text-anchor="middle"></g>
<g id="needle"><line x1="150" y1="150" x2="150" y2="52" stroke="var(--text)" stroke-width="2" stroke-linecap="round" opacity=".8"/><circle cx="150" cy="46" r="5" fill="var(--a)"/></g>
</svg>
<div class="ripples"><b></b><b></b><b></b></div>
<div class="readout"><div class="v" id="val">0.0</div><div class="u">ميجابت / ثانية</div><div class="ph" id="ph"></div></div>
</div>

<button class="go" id="go">ابدأ القياس</button>

<div class="grid">
<div class="card"><h3><svg viewBox="0 0 24 24" fill="none" stroke="var(--a)" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v13m0 0l-5-5m5 5l5-5"/></svg>التحميل</h3><div class="n" id="dl">—<small>Mbps</small></div><div class="bar"><span id="dlb"></span></div></div>
<div class="card"><h3><svg viewBox="0 0 24 24" fill="none" stroke="var(--c)" stroke-width="2.4" stroke-linecap="round"><path d="M12 20V7m0 0l-5 5m5-5l5 5"/></svg>الرفع</h3><div class="n" id="ul">—<small>Mbps</small></div><div class="bar"><span id="ulb" style="background:linear-gradient(90deg,var(--b),var(--c))"></span></div></div>
<div class="card"><h3>زمن الاستجابة</h3><div class="n" id="pg">—<small>ms</small></div></div>
<div class="card"><h3>تذبذب الاتصال</h3><div class="n" id="jt">—<small>ms</small></div></div>

<div class="card wide">
<h3>قوة إشارة الواي فاي</h3>
<div class="wifi">
<svg viewBox="0 0 100 100"><path class="arc" id="w3" d="M10 40a56 56 0 0 1 80 0"/><path class="arc" id="w2" d="M24 54a36 36 0 0 1 52 0"/><path class="arc" id="w1" d="M37 67a18 18 0 0 1 26 0"/><circle id="w0" cx="50" cy="82" r="6" fill="var(--track)"/></svg>
<div class="info"><div class="q" id="wq">لم يُقاس بعد</div><div class="d" id="wd">اضغط ابدأ لتحليل الإشارة</div>
<div class="bars" id="bars"><i style="height:30%"></i><i style="height:48%"></i><i style="height:66%"></i><i style="height:82%"></i><i style="height:100%"></i></div></div>
</div>
</div>

<div class="card wide"><h3>منحنى السرعة أثناء القياس</h3>
<svg class="chart" id="chart" viewBox="0 0 300 84" preserveAspectRatio="none"><defs><linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a)" stop-opacity=".35"/><stop offset="1" stop-color="var(--a)" stop-opacity="0"/></linearGradient></defs>
<path id="cfill" fill="url(#cf)"/><path id="cline" fill="none" stroke="var(--a)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg></div>
</div>
<p class="note" id="note">المتصفح لا يسمح بقراءة قوة الواي فاي مباشرة، فالقيم المعروضة تقدير مبني على حالة الشبكة.</p>
<footer class="credit" dir="ltr"><span>Created by:</span> <b>Moh.Salama</b></footer>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var root=document.documentElement;
$('theme').onclick=function(){var d=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);root.dataset.theme=d?'light':'dark'};
var MAX=200,tk='';
[0,25,50,100,150,200].forEach(function(v){var a=(135+270*v/MAX)*Math.PI/180,x=150+86*Math.cos(a),y=152+86*Math.sin(a);tk+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'">'+v+'</text>'});
$('ticks').innerHTML=tk;
function gauge(v){var f=Math.min(1,v/MAX);$('arc').setAttribute('stroke-dashoffset',100-f*100);$('glow').setAttribute('stroke-dashoffset',100-f*100);$('needle').setAttribute('transform','rotate('+(-135+270*f)+' 150 150)');$('val').textContent=v.toFixed(1)}
gauge(0);
var pts=[];
function chart(){if(pts.length<2)return;var m=Math.max.apply(null,pts)*1.15||1,s=pts.map(function(p,i){return(i/(pts.length-1)*300).toFixed(1)+' '+(80-p/m*74).toFixed(1)});$('cline').setAttribute('d','M'+s.join('L'));$('cfill').setAttribute('d','M'+s.join('L')+'L300 84L0 84Z')}
function setBar(id,v){$(id).style.width=Math.min(100,v/MAX*100)+'%'}
function num(id,v,d){$(id).innerHTML=v.toFixed(d)+'<small>'+(id==='pg'||id==='jt'?'ms':'Mbps')+'</small>'}
function run(label,dur,target,tick){return new Promise(function(res){var t0=performance.now();$('ph').textContent=label;(function f(now){var t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-Math.min(1,t*1.5),3),n=t<1?(Math.sin(now/90)*.07+Math.sin(now/37)*.04):0,v=Math.max(0,target*e*(1+n));tick(v);if(t<1)requestAnimationFrame(f);else{tick(target);res()}})(t0)})}
function wifi(q,rtt){var lvl=q>80?4:q>60?3:q>40?2:q>20?1:0,names=['ضعيفة جدًا','ضعيفة','متوسطة','جيدة','ممتازة'];
$('w0').setAttribute('fill',lvl>0?'var(--a)':'var(--track)');
['w1','w2','w3'].forEach(function(id,i){$(id).setAttribute('class','arc'+(lvl>i+1?' on':''))});
var bs=$('bars').children;for(var i=0;i<5;i++)bs[i].className=i<lvl+(lvl<4?0:1)&&i<=lvl?'on':'';
$('wq').textContent=names[lvl];var dbm=Math.round(-90+q*.6);$('wd').textContent='حوالي '+dbm+' dBm — '+Math.round(q)+'٪ (تقدير)'}
var busy=false;
$('go').onclick=async function(){
if(busy)return;busy=true;var b=$('go');b.disabled=true;b.textContent='جارٍ القياس…';
$('app').classList.add('live');$('stxt').textContent='يقيس الآن';
['dl','ul','pg','jt'].forEach(function(i){$(i).innerHTML='—<small>'+(i==='pg'||i==='jt'?'ms':'Mbps')+'</small>'});setBar('dlb',0);setBar('ulb',0);
var c=navigator.connection||{},real=!!c.downlink;
var dlT=real?Math.min(190,c.downlink*(.85+Math.random()*.3)):30+Math.random()*140;
var rtt=real&&c.rtt?c.rtt:12+Math.random()*40;
var upT=dlT*(.25+Math.random()*.35),jit=rtt*(.05+Math.random()*.25);
pts=[];
await run('نقيس زمن الاستجابة…',1500,rtt,function(v){num('pg',v,0);gauge(0)});
num('jt',jit,1);
await run('نقيس سرعة التحميل…',4200,dlT,function(v){gauge(v);num('dl',v,1);setBar('dlb',v);pts.push(v);if(pts.length>160)pts.shift();chart()});
gauge(0);pts=[];
await run('نقيس سرعة الرفع…',3200,upT,function(v){gauge(v);num('ul',v,1);setBar('ulb',v);pts.push(v);if(pts.length>160)pts.shift();chart()});
var q=Math.max(5,Math.min(98,100-rtt*.9+Math.min(dlT,100)*.15-jit));wifi(q,rtt);
$('ph').textContent='اكتمل القياس';$('app').classList.remove('live');$('stxt').textContent='اكتمل';
$('note').textContent=real?'التحميل وزمن الاستجابة مأخوذان من واجهة حالة الشبكة في المتصفح، والباقي تقدير.':'متصفحك لا يوفر بيانات الشبكة، فهذه نتائج تجريبية للعرض فقط.';
b.disabled=false;b.textContent='قياس جديد';busy=false};
})();
</script>
</body>
</html>
